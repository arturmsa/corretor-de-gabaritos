# Corretor de Gabaritos · criado pelo Prof. Artur
# Gera o APK a partir do arquivo corretor-de-gabaritos.zip enviado ao repositório.
name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Encontrar o projeto
        run: |
          ZIP=$(find . -name 'corretor-de-gabaritos*.zip' -not -path './.git/*' | head -1)
          if [ -n "$ZIP" ]; then
            echo "Usando o arquivo $ZIP"
            rm -rf "$RUNNER_TEMP/build" && mkdir -p "$RUNNER_TEMP/build"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/build"
            DIR=$(dirname "$(find "$RUNNER_TEMP/build" -name package.json -not -path '*/node_modules/*' | head -1)")
          else
            DIR=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -1)")
          fi
          if [ ! -f "$DIR/package.json" ] || [ ! -d "$DIR/www" ] || [ ! -d "$DIR/android" ]; then
            echo "::error::Projeto incompleto. Envie o arquivo corretor-de-gabaritos.zip para o repositório."
            exit 1
          fi
          echo "PROJETO=$(cd "$DIR" && pwd)" >> "$GITHUB_ENV"
          ls -la "$DIR"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Aceitar licenças do Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependências
        working-directory: ${{ env.PROJETO }}
        run: npm ci

      - name: Copiar o app para o projeto Android
        working-directory: ${{ env.PROJETO }}
        run: npx cap sync android

      - name: Compilar APK
        working-directory: ${{ env.PROJETO }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/corretor-de-gabaritos.apk"

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Corretor de Gabaritos 1.0.${{ github.run_number }}
          body: |
            APK do Corretor de Gabaritos, criado pelo Prof. Artur.
            Baixe o arquivo corretor-de-gabaritos.apk abaixo e instale no Android.
          files: corretor-de-gabaritos.apk
