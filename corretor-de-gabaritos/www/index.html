<!doctype html>
<!--
  Corretor de Gabaritos
  Criado pelo Prof. Artur, professor de Filosofia da
  E.E. Monsenhor Joaquim Honório, Guamaré/RN.
  App gratuito, feito para ser compartilhado entre professores.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d3a5f">
  <meta name="author" content="Prof. Artur">
  <title>Corretor de Gabaritos</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btnVoltar" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="titulo">Corretor de Gabaritos</h1>
    <button class="icon-btn" id="btnMenu" aria-label="Mais opções">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </button>
  </header>

  <nav class="menu" id="menu" hidden>
    <button data-go="#/">Início</button>
    <button data-acao="folhaBranca">Folha em branco (PDF)</button>
    <button data-acao="escola">Nome da escola</button>
    <button data-acao="backup">Fazer cópia de segurança</button>
    <button data-acao="restaurar">Restaurar cópia de segurança</button>
    <button data-go="#/sobre">Sobre o app</button>
  </nav>

  <main id="view" tabindex="-1"></main>

  <div class="overlay" id="carregando" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <p id="carregandoMsg">Lendo a folha…</p>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialogo"></dialog>

  <input type="file" id="inputFoto" accept="image/*" capture="environment" hidden>
  <input type="file" id="inputBackup" accept="application/json,.json" hidden>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="vendor/xlsx.mini.min.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/omr.js"></script>
  <script src="js/sheet-pdf.js"></script>
  <script src="js/store.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
